<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%TITLE%</title>
    <meta name="description" content="%OG_DESCRIPTION%" />
    <link rel="icon" href="data:," />
    <!-- Painted art that exists in public/art/ (the curtain shows first, the hero is behind it). -->
    %PRELOAD%
    <meta name="theme-color" content="#B2D7EC" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:title" content="%TITLE%" />
    <meta property="og:description" content="%OG_DESCRIPTION%" />
    <!-- Absolute URL: WhatsApp and other crawlers often ignore relative og:image paths. -->
    <meta property="og:image" content="%SITE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Playfair+Display:wght@700&display=swap"
    />
    <!-- Arabic (Amiri) and Urdu (Nastaliq) are subset at build time to just the characters used. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&text=%ARABIC_TEXT%&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&text=%URDU_TEXT%&display=swap" />
  </head>
  <body class="locked">
    <div id="curtain-root"></div>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
