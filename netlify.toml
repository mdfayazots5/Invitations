# One netlify.toml for every branch. Every branch holds every folder;
# the branch a Netlify site deploys decides which folder it builds.
#
#   Branch        Folder          Netlify site
#   Fayaz         fayaz/          fayazinvitation
#   FayazMD       fayazmd/        mdfayazinvitation
#   Muskan        muskan/         muskaninvitation
#   MuskanKhanam  muskankhanam/   (not created yet)
#   Muskanone     muskanone/      (not created yet)
#   Admin         admin/          admin site: timings & music for every invite (password protected)
#
# Leave "Base directory" empty in each site's Netlify settings so this file is read.

[build]
  command = "echo 'No invitation is mapped to this branch in netlify.toml' && exit 1"
  publish = "dist"
  # Skip the build when this branch's folder (and this file) did not change.
  ignore = "bash scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "22"

[context.Fayaz]
  command = "cd fayaz && npm ci && npm run build"
  publish = "fayaz/dist"

[context.FayazMD]
  command = "cd fayazmd && npm ci && npm run build"
  publish = "fayazmd/dist"

[context.Muskan]
  command = "cd muskan && npm ci && npm run build"
  publish = "muskan/dist"

[context.MuskanKhanam]
  command = "cd muskankhanam && npm ci && npm run build"
  publish = "muskankhanam/dist"

[context.Muskanone]
  command = "cd muskanone && npm ci && npm run build"
  publish = "muskanone/dist"

[context.Admin]
  command = "cd admin && npm ci && npm run build"
  publish = "admin/dist"

# The admin username ("fayazmd") is also an invitation folder name, so Netlify's secret scan finds it all over
# the repo and stops the build. The username isn't a secret: skip scanning for that one key only.
# ADMIN_PASSWORD, SESSION_SECRET and GITHUB_TOKEN are still scanned.
[context.Admin.environment]
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_USER"

# Phone tester uploads (shared/autotest → /api/autotest). Same function on every site; each site has its own store.
[functions]
  directory = "netlify/functions"
